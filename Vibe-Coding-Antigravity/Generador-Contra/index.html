<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Generador de contraseñas aleatorias y seguras">
    <title>Generador de Contraseñas</title>
    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">
    
    <main class="password-card container p-4 p-md-5 rounded shadow-lg">
        <header class="text-center mb-4">
            <h1 class="h2 fw-bold text-primary-custom">Generador de Contraseñas</h1>
            <p class="text-muted-custom">Crea contraseñas seguras y aleatorias</p>
        </header>

        <!-- Notification Area -->
        <div id="notification-area" class="mb-3" aria-live="polite"></div>

        <section class="password-display-section position-relative mb-4">
            <div class="input-group input-group-lg">
                <input type="password" id="password-output" class="form-control password-input bg-darker text-white border-0" readonly placeholder="Tu contraseña aparecerá aquí" aria-label="Contraseña generada">
                
                <button class="btn btn-outline-primary-custom" type="button" id="toggle-visibility-btn" aria-label="Mostrar u ocultar contraseña" title="Mostrar/Ocultar">
                    <!-- SVG Eye Icon -->
                    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                        <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                    </svg>
                    <!-- SVG Eye Slash Icon (Hidden by default) -->
                    <svg id="eye-slash-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-eye-slash d-none" viewBox="0 0 16 16">
                        <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7.028 7.028 0 0 0-2.79.588l.77.771A5.944 5.944 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.134 13.134 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755-.165.165-.337.328-.517.486l.708.709z"/>
                        <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829l.822.822zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829z"/>
                        <path d="M3.35 5.47c-.18.16-.353.322-.518.487A13.134 13.134 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7.029 7.029 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12-.708.708z"/>
                    </svg>
                </button>
                <button class="btn btn-primary-custom" type="button" id="copy-btn" aria-label="Copiar contraseña" title="Copiar al portapapeles">
                    <!-- SVG Copy Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-copy" viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M4 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V2Zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H6ZM2 5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-1h1v1a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1v1H2Z"/>
                    </svg>
                </button>
            </div>
            
            <div class="strength-meter mt-3 d-flex align-items-center">
                <span class="strength-label me-3 fs-5">Fortaleza:</span>
                <div class="progress flex-grow-1 bg-darker" style="height: 0.8rem;">
                    <div id="strength-bar" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
                <span id="strength-text" class="ms-3 fs-5 fw-bold strength-text-default">N/A</span>
            </div>
        </section>

        <form id="generator-form" class="generator-options">
            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <label for="length-slider" class="form-label fs-4 mb-0">Longitud de la contraseña</label>
                    <span id="length-display" class="fs-3 fw-bold text-primary-custom">12</span>
                </div>
                <input type="range" class="form-range custom-range" id="length-slider" min="6" max="32" value="12">
            </div>

            <div class="row g-3 mb-4 fs-5">
                <div class="col-sm-6">
                    <div class="form-check form-switch custom-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="opt-uppercase" checked>
                        <label class="form-check-label" for="opt-uppercase">Mayúsculas (A-Z)</label>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-check form-switch custom-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="opt-lowercase" checked>
                        <label class="form-check-label" for="opt-lowercase">Minúsculas (a-z)</label>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-check form-switch custom-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="opt-numbers" checked>
                        <label class="form-check-label" for="opt-numbers">Números (0-9)</label>
                    </div>
                </div>
                <div class="col-sm-6">
                    <div class="form-check form-switch custom-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="opt-symbols" checked>
                        <label class="form-check-label" for="opt-symbols">Especiales (!@#$)</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary-custom w-100 py-3 fs-4 fw-bold text-uppercase generate-btn">
                Generar Contraseña
            </button>
        </form>
    </main>

    <script src="assets/js/app.js"></script>
</body>
</html>
